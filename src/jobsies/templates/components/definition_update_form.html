{% extends "components/dialog.html" %}

{% block dialog_title %}Update Jobsie Definition{% endblock %}

{% block dialog_body %}
<form
  id="update-definition-form"
  hx-patch="/definition/{{ definition.id }}"
  hx-target="#definitions-table"
  hx-swap="outerHTML"
  hx-on::after-request="if(event.detail.successful) document.getElementById('dialog').remove()"
>
  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required class="form-control" placeholder="e.g. Zalando Camper" value="{{ definition.name }}">
  </div>

  <div class="form-group">
    <label for="subclass_name">Jobsie Type</label>
    <select id="subclass_name" name="subclass_name" required class="form-control">
      <option value="">-- Select a type --</option>
      {% for subclass in subclasses %}
      <option value="{{ subclass }}" {% if definition.subclass_name == subclass %}selected{% endif %}>{{ subclass }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="form-group">
    <label for="cron">Cron Expression</label>
    <input type="text" id="cron" name="cron" required class="form-control" placeholder="e.g. 0 0 * * *" value="{{ definition.cron }}">
  </div>

  <div class="form-group">
    <label for="retention">Retention</label>
    <input type="text" id="retention" name="retention" class="form-control" placeholder="e.g. 30d (default: 0)" value="{{ definition.retention }}">
  </div>

  <div class="form-group">
    <label for="input_kwargs">Input Kwargs (JSON)</label>
    <textarea id="input_kwargs" name="input_kwargs" class="form-control" rows="3" placeholder='{"url": "https://zalando.cz/item"}'>{{ definition.input_kwargs | tojson }}</textarea>
  </div>

  <div class="form-group form-check">
    <input type="checkbox" id="enabled" name="enabled" class="form-check-input" {% if definition.enabled %}checked{% endif %}>
    <label for="enabled" class="form-check-label">Enabled</label>
  </div>

  <div class="form-actions">
    <button type="button" class="btn btn-secondary" onclick="this.closest('dialog').remove()">Cancel</button>
    <button type="submit" class="btn btn-primary">Update Definition</button>
  </div>
</form>
{% endblock %}
