services:
  # Redis for message queue and scheduling
  redis:
    container_name: jobsies-redis
    image: redis:alpine
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  # Creates and validates the database before the app and worker start
  setup:
    container_name: jobsies-setup
    build: .
    command: ["setup"]
    restart: "no"
    env_file:
      - ./.env.container
    volumes:
      - ./data:/app/data

  # Worker is responsible for durable execution
  worker:
    container_name: jobsies-worker
    build: .
    command: ["worker"]
    restart: unless-stopped
    env_file:
      - ./.env.container
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1GB

  # App handles user interface
  app:
    container_name: jobsies-app
    build: .
    command: ["app"]
    restart: unless-stopped
    ports:
      - "8777:8000"
    env_file:
      - ./.env.container
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M
