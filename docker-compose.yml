services:
  redis:
    container_name: jobsies-redis
    image: redis:alpine
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  worker:
    container_name: jobsies-worker
    build: .
    command: ["worker"]
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      TZ_INFO: Europe/Prague
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1GB

  app:
    container_name: jobsies-app
    build: .
    command: ["app"]
    restart: unless-stopped
    ports:
      - "8777:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      TZ_INFO: Europe/Prague
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M