{% extends "menu.html" %}

{% block title %}Jobsies - Definitions{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Definitions</h1>
    <p class="subtitle">Manage and view registered jobsie tasks and schedules.</p>
  </div>
  <div class="actions">
    {% include "components/status_bar.html" %}
    <button class="btn btn-sm btn-ghost btn-action"
            hx-get="/definition/table"
            hx-target="#definitions-table"
            hx-swap="outerHTML"
            title="Refresh"
            aria-label="Refresh">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-refresh"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" /><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" /></svg>
      Refresh
    </button>
    <button class="btn btn-sm btn-ghost btn-action"
            hx-get="/definition/create"
            hx-target="#dialog-container"
            hx-swap="innerHTML"
            title="Create"
            aria-label="Create">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-pencil-plus"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4" /><path d="M13.5 6.5l4 4" /><path d="M16 19h6" /><path d="M19 16v6" /></svg>
      Create
    </button>
  </div>
</div>

<div
  id="definitions-table"
  hx-get="/definition/table"
  hx-trigger="load"
  hx-swap="outerHTML"
></div>

<div id="dialog-container"></div>

<script>
  document.addEventListener('htmx:afterSettle', function() {
    const bar = document.getElementById('status-bar');
    if (bar && bar.classList.contains('show')) {
      clearTimeout(bar._hideTimer);
      bar._hideTimer = setTimeout(() => {
        bar.classList.remove('show');
      }, 10000);
    }
  });
</script>
{% endblock %}
