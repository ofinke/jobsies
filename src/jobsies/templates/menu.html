<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Jobsies{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/colors.css">
  <link rel="stylesheet" href="/static/css/sidebar.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script>
    document.addEventListener('htmx:beforeSwap', function(evt) {
      if (evt.detail.xhr.status === 422) {
        evt.detail.shouldSwap = true;
      }
    });
  </script>
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <div class="sidebar-title">JOBSIES</div>
      <ul>
        <li><a href="/" class="nav-link{% if active_page == 'results' %} active{% endif %}">
          <span class="nav-icon-circle"><img src="/static/img/bulb.svg" alt=""></span>
          Results
        </a></li>
        <li><a href="/definition" class="nav-link{% if active_page == 'definitions' %} active{% endif %}">
          <span class="nav-icon-circle"><img src="/static/img/briefcase.svg" alt=""></span>
          Definitions
        </a></li>
      </ul>
      <div class="sidebar-footer">
        <hr>
        <a href="https://github.com/ofinke/jobsies" target="_blank" class="github-link">
          <img src="/static/img/github.svg" alt="GitHub">
          <span>v{{ app_version }}</span>
        </a>
      </div>
    </nav>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
