<div id="status-bar" class="status-bar{% if message %} show{% endif %}{% if type %} status-{{ type }}{% endif %}" hx-swap-oob="true">
  {% if icon %}
   <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="status-icon icon-tabler icons-tabler-outline icon-tabler-{{ icon }}">
    {% if icon == "check" %}
    <path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M5 12l5 5l10 -10" />
    {% elif icon == "alert-circle" %}
    <path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M12 8v4m0 4h.01" /><path d="M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0 -18z" />
    {% endif %}
  </svg>
  {% endif %}
  <span id="status-message" class="status-message">{{ message }}</span>
</div>
